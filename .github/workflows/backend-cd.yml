name: Deploy Backend to EC Instance (Docker)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'backend/**'

env:
  REGISTRY: ghcr.io
  # Use lowercase for image name to avoid docker build errors
  IMAGE_NAME: ${{ github.repository_owner }}/missionsim-backend

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    
    steps:
      - name: Execute remote SSH commands to pull and run Docker image
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE="${{ env.REGISTRY }}/$OWNER/missionsim-backend:latest"
            
            echo "$GITHUB_TOKEN" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            docker pull $IMAGE
            
            docker stop missionsim-backend || true
            docker rm missionsim-backend || true
            
            docker run -d \
              --name missionsim-backend \
              --restart unless-stopped \
              --env-file /var/www/template-vite-ts/backend/.env \
              -p 3001:3001 \
              $IMAGE

      - name: Health check (wait for backend to be ready)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 15); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/health 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Backend is healthy! (attempt $i)"
                exit 0
              fi
              echo "Attempt $i/15 - status: $STATUS, retrying in 2s..."
              sleep 2
            done
            echo "Backend failed to become healthy after 30 seconds!"
            echo "--- Container logs ---"
            docker logs missionsim-backend --tail 50
            exit 1
